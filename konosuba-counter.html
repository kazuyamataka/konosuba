<meta charset="utf-8">
<title>このすば 設定推測カウンター</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
:root{--bg:#151109;--panel:#1F1A11;--panel2:#2A2217;--line:#3B3123;
 --amber:#F2A62A;--amber2:#8A6318;--teal:#3FC79A;--ink:#F2EADB;--ink2:#A79880;--ink3:#6E6353;
 --qb:#5B9BE6;--qy:#E8C547;--qg:#5CC46A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{touch-action:pan-y}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;padding-bottom:28px;
 font-family:-apple-system,"Helvetica Neue","Hiragino Sans","Noto Sans JP",sans-serif}
.seg{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
header{padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
h1{margin:0;font-size:15px;font-weight:500;letter-spacing:.03em;flex:none;white-space:nowrap}
.tot{flex:1;min-width:0;font-size:11px;color:var(--ink3);text-align:right}
section{padding:16px;border-bottom:1px solid var(--line)}
.lbl{font-size:11px;letter-spacing:.11em;color:var(--ink3);text-transform:uppercase;margin:0 0 9px;
 display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:28px}
.lbl .warn{color:var(--amber);letter-spacing:.03em}
.lbl .now{color:var(--ink);font-size:13px;letter-spacing:.02em;text-transform:none}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chips.c4{grid-template-columns:repeat(4,1fr)}
.chips.c3{grid-template-columns:repeat(3,1fr)}
.chip{padding:11px 4px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);
 border-radius:9px;font-size:13px;text-align:center;font-family:inherit;cursor:pointer}
.chip.sm{padding:8px 2px;font-size:12px}
.chip[aria-pressed=true]{border-color:var(--amber);color:var(--amber);background:var(--panel2)}
.chip small{display:block;font-size:10px;color:var(--ink3);margin-top:1px}
.chip[aria-pressed=true] small{color:var(--amber2)}
.sub{font-size:12px;color:var(--ink2);margin:14px 0 7px;display:flex;justify-content:space-between;gap:8px}
.sub:first-of-type{margin-top:4px}
.sub em{font-style:normal;color:var(--ink3);font-size:11px}
.quad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tap{padding:12px 4px;border:1px solid var(--line);background:var(--panel);border-radius:11px;
 color:var(--ink);font-family:inherit;cursor:pointer;text-align:center}
.tap b{display:block;font-size:22px;font-weight:500;line-height:1.15}
.tap span{font-size:11px;color:var(--ink3)}
.tap.on b{color:var(--teal)}
.tap.off b{color:var(--ink2)}
.tags{font-size:12.5px;color:var(--ink2);margin-top:8px;min-height:20px}
.tags b{color:var(--amber);font-weight:500}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.rn{flex:1;min-width:0}.rn b{display:block;font-weight:400;font-size:14px}
.rn i{font-style:normal;font-size:11px;color:var(--ink3)}
.val{width:48px;text-align:right;font-size:24px;color:var(--amber);font-weight:500}
.btn{width:44px;height:44px;flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);
 border-radius:11px;font-size:20px;font-family:inherit;cursor:pointer;line-height:1}
.btn.m{width:38px;height:38px;color:var(--ink3);font-size:21px}
.wide{width:100%;padding:14px;border-radius:11px;border:1px solid var(--amber);background:var(--panel2);
 color:var(--amber);font-size:15px;font-family:inherit;cursor:pointer;margin-top:14px}
.wide:disabled{border-color:var(--line);color:var(--ink3);background:var(--panel)}
.wide.teal{border-color:var(--teal);color:var(--teal)}
.wide.teal:disabled{border-color:var(--line);color:var(--ink3)}
.ghost{border-color:var(--line);color:var(--ink3);background:transparent;margin-top:8px}
.mini{border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:7px;
 font-size:11px;letter-spacing:0;padding:6px 11px;font-family:inherit;cursor:pointer;flex:none;
 max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:none}
.mini[hidden]{display:none}
.qrow{display:grid;grid-template-columns:62px 1fr 1fr;gap:7px;align-items:center;margin:6px 0}
.qn{font-size:13px;display:flex;align-items:center;gap:6px}
.qn i{font-style:normal;font-size:10px;color:var(--ink3);display:block}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
.qrow .tap{padding:9px 4px;display:flex;justify-content:center;align-items:baseline;gap:6px}
.qrow .tap b{display:inline;font-size:20px}
/* 押下フィードバック */
.btn,.tap,.chip,.mini,.wide{transition:transform .06s,background .06s,border-color .06s}
.btn.pressed,.mini.pressed{background:var(--panel2);border-color:var(--amber2);transform:scale(.93)}
.tap.pressed,.chip.pressed{background:var(--panel2);border-color:var(--amber2);transform:scale(.97)}
.wide.pressed{transform:scale(.985);background:var(--panel)}
@keyframes fl{from{color:var(--teal);transform:scale(1.14)}to{}}
.flash{animation:fl .34s ease-out}
.bar{display:flex;align-items:center;gap:9px;margin:5px 0}
.bk{width:22px;font-size:13px;color:var(--ink2)}
.bt{flex:1;height:14px;background:var(--panel);border-radius:4px;overflow:hidden}
.bf{height:100%;background:var(--amber);transition:width .25s}
.bv{width:50px;text-align:right;font-size:13px;color:var(--ink2)}
.bands{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:13px}
.bc{background:var(--panel);border-radius:9px;padding:10px 4px;text-align:center}
.bc b{display:block;font-size:21px;font-weight:500;color:var(--amber)}
.bc span{font-size:10px;color:var(--ink3);letter-spacing:.05em}
.h{font-size:12.5px;color:var(--ink2);padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.h span{flex:1;min-width:0}
.h.bad{color:var(--amber)}
.h .tg{flex:none;font-size:10px;color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.x{border:0;background:none;color:var(--ink3);font-size:17px;cursor:pointer;font-family:inherit;
 width:34px;height:34px;flex:none}
.x.pressed{color:var(--amber);transform:scale(.88)}
.note{font-size:11.5px;color:var(--ink3);line-height:1.7;margin-top:11px}
.empty{color:var(--ink3);font-size:13px;padding:10px 0}
.h.live{color:var(--ink)}
.h.live .tg{color:var(--teal);border-color:var(--teal)}
/* 下部ドック：タップ頻度の高い操作ほど下（親指側）・大きく */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#120E07;border-top:1px solid var(--amber2);
 padding:8px 10px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 18px rgba(0,0,0,.45)}
.dhead{display:flex;align-items:center;gap:8px;min-height:40px;margin-bottom:4px}
.dnow{flex:1;min-width:0;font-size:13px;line-height:1.35;color:var(--ink2);overflow:hidden}
.dnow b{color:var(--ink);font-weight:600}
.dnow span{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#undo{font-size:12px;padding:9px 12px;border-color:var(--amber2);color:var(--amber)}
.dl{font-size:10.5px;color:var(--ink3);margin:6px 2px 4px;letter-spacing:.04em}
.drow{display:grid;gap:7px}
.drow.r1{grid-template-columns:1.5fr 1.2fr .8fr}
.drow.r2{grid-template-columns:repeat(4,1fr)}
.drow.r3{grid-template-columns:2fr 1.4fr .8fr}
.dk{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;font-family:inherit;
 cursor:pointer;text-align:center;padding:0 4px;transition:transform .06s,background .06s,border-color .06s}
.dk:disabled{opacity:.35}
.dk.pressed{background:var(--panel2);border-color:var(--amber2);transform:scale(.96)}
.r1 .dk{height:50px;font-size:13px}
.dk.oth{display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:var(--ink2)}
.dk.oth b{font-size:22px;font-weight:500;color:var(--amber)}
.dk.at{border-color:var(--amber);color:var(--amber);font-weight:600}
.dk.at small{display:block;font-size:10px;font-weight:400;color:var(--amber2);line-height:1}
.dk.mid{font-size:11px;line-height:1.25;color:var(--ink3)}
.r2 .dk{height:62px}
.dk.st b{display:block;font-size:24px;font-weight:500;line-height:1.1;color:var(--ink2)}
.dk.st.on b{color:var(--teal)}
.dk.st span{font-size:11px;color:var(--ink3)}
.r3 .dk{height:70px;font-size:16px;font-weight:600}
.dk.skw.off{border-color:var(--ink3);background:var(--panel2)}
.dk.skw.on{border-color:var(--teal);color:var(--teal)}
.dk.skw.unk{color:var(--ink3);font-size:13px;font-weight:400}
.droles{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.dr{height:62px;border:1px solid var(--amber2);background:var(--panel2);color:var(--amber);border-radius:12px;
 font-family:inherit;font-size:15px;cursor:pointer}
.dr small{display:block;font-size:10px;color:var(--ink3)}
.dr.pressed{transform:scale(.96);border-color:var(--amber)}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pk{height:48px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;
 font-size:19px;font-family:inherit;cursor:pointer}
.pk.cancel{font-size:13px;color:var(--ink3)}
.pk.pressed{transform:scale(.94);border-color:var(--amber2)}
</style>

<header><h1>このすば 設定推測</h1><div class="tot seg" id="tot"></div></header>

<section>
  <p class="lbl"><span>設定推測（事後確率）</span></p>
  <div id="post"></div>
  <div class="bands" id="bands"></div>
  <div class="note" id="sum"></div>
</section>

<section>
  <p class="lbl"><span>この有利区間</span><span class="seg" id="ivsum"></span></p>
  <p class="sub"><span>1G目の成立役</span><span class="warn" id="rolewarn"></span></p>
  <div class="chips" id="roles"></div>
  <p class="sub"><span>記録を始めた周期</span><em>途中から座った時だけ変更</em></p>
  <div class="chips c4" id="starts"></div>
  <p class="sub"><span>Lv4濃厚演出</span><em>出た区間だけオン</em></p>
  <div class="chips"><button class="chip" id="lv4"></button></div>
  <p class="sub"><span>セット</span><em>新しい順</em></p>
  <div id="setlist"></div>
  <button class="wide ghost" id="quit">AT当選なしで区間を締める（ヤメ・台移動）</button>
</section>

<section>
  <p class="lbl"><span>クエスト最終色と結果（通しで計上）</span><button class="mini" id="qundo" hidden></button></p>
  <div id="quests"></div>
  <div class="note">赤（80pt以上）は設定1以外の成功率が非公開のため記録しません。</div>
</section>

<section>
  <p class="lbl"><span>AT終了時ボイス（通しで計上）</span><button class="mini" id="vundo" hidden></button></p>
  <div id="voices"></div>
</section>

<section>
  <p class="lbl"><span>確定済みの有利区間</span></p>
  <div id="hist"></div>
  <button class="wide ghost" id="reset">全データを消去</button>
</section>

<div id="dock">
  <div class="dhead">
    <div class="dnow" id="dnow"></div>
    <button class="mini" id="undo" hidden></button>
  </div>
  <div id="dbody"></div>
</div>

<script>

const ROLES=[{k:'other',n:'下記以外',s:'その他の小役・ハズレ'},
 {k:'bara',n:'バラケ目リプレイ',s:'最も情報量が大きい'},
 {k:'weak',n:'弱キャラ役',s:'各1/19.2'},
 {k:'strong',n:'強キャラ役',s:'各1/240・設定差なし'}];

const LDIST={
 other:[[50.00,45.31,3.91,0.78],[46.88,45.31,7.03,0.78],[46.88,45.31,4.69,3.13],
        [43.75,45.31,9.38,1.56],[44.14,45.31,6.25,4.30],[38.28,45.31,11.72,4.69]],
 bara: [[34.38,31.25,25.00,9.38],[26.56,31.25,31.25,10.94],[24.22,31.25,25.78,18.75],
        [21.88,31.25,34.38,12.50],[17.97,31.25,26.56,24.22],[6.25,31.25,37.50,25.00]],
 weak: [[35.94,45.31,17.19,1.56],[29.69,45.31,23.44,1.56],[32.03,45.31,17.97,4.69],
        [27.34,45.31,24.22,3.13],[27.34,45.31,18.75,8.59],[20.31,45.31,25.00,9.38]],
 strong:[[0,0,75,25],[0,0,75,25],[0,0,75,25],[0,0,75,25],[0,0,75,25],[0,0,75,25]]};

// モード移行率 [SKWなし通常,高確,超高確, SKWあり通常,高確,超高確]
// A: 2周期目以降＆1周期目のアクア / B: 1周期目のアクア以外
const A=[
 [[92.19,.39,.39,6.25,.39,.39],[92.19,.39,.39,6.25,.39,.39],[89.84,.78,.78,7.03,.78,.78],
  [87.50,1.17,1.17,7.81,1.17,1.17],[84.38,1.95,1.95,8.59,1.56,1.56],[82.03,2.34,2.34,9.38,1.95,1.95]],
 [[80.47,5.86,.39,12.50,.39,.39],[80.47,5.86,.39,12.50,.39,.39],[76.56,7.81,.78,13.28,.78,.78],
  [71.48,10.94,1.17,14.06,1.17,1.17],[66.80,12.50,1.95,14.84,1.95,1.95],[63.28,14.06,2.34,15.63,2.34,2.34]],
 [[20.31,43.75,6.25,25.00,3.13,1.56],[20.31,43.75,6.25,25.00,3.13,1.56],[17.19,43.75,7.03,25.78,3.91,2.34],
  [14.06,43.75,7.81,26.56,4.69,3.13],[10.94,43.75,8.59,27.34,5.47,3.91],[7.81,43.75,9.38,28.13,6.25,4.69]],
 [[12.5,12.5,12.5,25,12.5,25],[12.5,12.5,12.5,25,12.5,25],[12.5,12.5,12.5,25,12.5,25],
  [12.5,12.5,12.5,25,12.5,25],[12.5,12.5,12.5,25,12.5,25],[12.5,12.5,12.5,25,12.5,25]]
].map(l=>l.map(v=>v.map(x=>x/100)));

const B=[
 [[151,1,1,101,1,1],[151,1,1,101,1,1],[146,2,2,102,2,2],[141,3,3,103,3,3],[134,5,5,104,4,4],[129,6,6,105,5,5]],
 [[128,15,1,110,1,1],[128,15,1,110,1,1],[116,20,2,114,2,2],[107,24,3,116,3,3],[92,32,5,118,5,4],[83,36,6,120,6,5]],
 [[64,48,16,112,14,2],[64,48,16,112,14,2],[54,48,20,114,16,4],[42,48,24,118,18,6],[32,48,28,120,20,8],[22,48,32,122,22,10]],
 [[32,32,32,96,32,32],[32,32,32,96,32,32],[32,32,32,96,32,32],[32,32,32,96,32,32],[32,32,32,96,32,32],[32,32,32,96,32,32]]
].map(l=>l.map(v=>v.map(x=>x/256)));

// 状態別：弱キャラ役1回の期待お風呂個数・強キャラ役1回の期待個数・BAR揃い(1G)
const WEAK=[0.004,0.031,0.137],STRONG=[0.512,0.891,1.315],
      BAR=[20/194.7,20/129.3,20/86.2],WEAKN=20/3.2;
// 1セット(20G)の「強キャラ役以外」由来のお風呂期待個数（弱キャラ役＋BAR揃い）
const LAM_OTH=[0,1,2].map(st=>WEAKN*WEAK[st]+BAR[st]);

// 強キャラ役1回あたりのお風呂当選個数（0/1/2/3）
const SM=[[50.0,49.2,.4,.4],[25.0,62.5,10.9,1.6],[0,75.0,18.8,6.3]]
 .map(r=>{const t=r.reduce((a,b)=>a+b,0);return r.map(x=>x/t)});
// 連続の切れ目で弱キャラ役当選が紛れ込む率（1Gあたり）＝1/3.2×弱キャラ役のお風呂当選率
const CONT=[0.004,0.031,0.125].map(x=>x/3.2);
const CONT_WMAX=5; // 紛らわしい長さ：0〜5Gを均等に平均（断定を避ける）
// 観測される連続数（0/1/2/3+）の状態別確率
const PCH=[0,1,2].map(st=>{const o=[0,0,0,0],c=CONT[st];
 for(let w=0;w<=CONT_WMAX;w++){const ww=1/(CONT_WMAX+1);
  // 紛れ込み個数 e ~ 二項(w, c)
  const pe=[];for(let e=0;e<=w;e++)pe.push(binom(w,e)*Math.pow(c,e)*Math.pow(1-c,w-e));
  for(let k=0;k<4;k++){const pk=SM[st][k];if(pk<=0)continue;
   if(k===0){o[0]+=ww*pk;continue}
   pe.forEach((p,e)=>{o[Math.min(k+e,3)]+=ww*pk*p})}}
 return o});
function binom(n,k){let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return r}
const PFLOOR=1e-4; // 押し間違い対策：理論上0の組み合わせでも完全排除はしない

// クエスト：最終ポイント帯（色）別の成功率
const QUEST=[{k:'q0',n:'青',s:'0〜39pt',c:'var(--qb)',p:[6.3,7.0,7.8,8.6,9.4,10.2]},
 {k:'q1',n:'黄',s:'40〜59pt',c:'var(--qy)',p:[12.5,14.1,15.6,17.2,18.8,20.3]},
 {k:'q2',n:'緑',s:'60〜79pt',c:'var(--qg)',p:[37.5,39.1,40.6,42.2,43.8,45.3]}];

// AT終了時ボイス（多項）。各行[設定1..6]の出現率。全区間通しで独立計上。
const VOICES=[
 {k:'v0',n:'もっと私を〜',s:'無地・奇数寄り',p:[66.81,53.54,63.76,50.87,60.25,48.43]},
 {k:'v1',n:'では〜',      s:'無地・偶数寄り',p:[30.52,38.15,30.52,38.15,30.52,38.15]},
 {k:'v2',n:'さあ！私と〜',s:'偶数示唆',    p:[0.76,4.58,1.14,4.58,1.53,4.58]},
 {k:'v3',n:'前から〜',    s:'高設定ほど微増',p:[1.53,1.91,2.29,2.67,2.90,3.05]},
 {k:'v4',n:'人が深淵を〜',s:'高設定ほど増加',p:[0.38,0.76,1.14,1.91,2.29,2.67]},
 {k:'v5',n:'そっちの名前で〜',s:'設定2以上',p:[0,1.07,1.14,1.22,1.30,1.37]},
 {k:'v6',n:'真の男女平等〜',s:'設定4以上', p:[0,0,0,0.61,0.69,0.76]},
 {k:'v7',n:'でーがらーし〜',s:'設定5以上', p:[0,0,0,0,0.53,0.61]},
 {k:'v8',n:'この邂逅は〜',s:'設定6のみ',  p:[0,0,0,0,0,0.38]}];
const VEPS=1e-4; // 0%ボイスの床（誤タップ・丸め対策で完全排除は避ける）
function voiceLog(vc,s){let t=0;
 for(let i=0;i<VOICES.length;i++){const c=vc[VOICES[i].k]||0;
   if(c>0)t+=c*Math.log(Math.max(VOICES[i].p[s]/100,VEPS));}
 return t;}
function questLog(q,s){let t=0;
 for(const Q of QUEST){const p=Q.p[s]/100,a=q[Q.k+'s']||0,b=q[Q.k+'f']||0;
   t+=a*Math.log(p)+b*Math.log(1-p)}
 return t}

const skw=(T,l,s)=>T[l][s][3]+T[l][s][4]+T[l][s][5];
function lf(n){let r=0;for(let i=2;i<=n;i++)r+=Math.log(i);return r}
function lbin(k,n,p){if(n<=0)return 0;p=Math.min(Math.max(p,1e-9),1-1e-9);
 return lf(n)-lf(k)-lf(n-k)+k*Math.log(p)+(n-k)*Math.log(1-p)}
function poi(k,lam){if(lam<=0)return k>0?-700:0;return k*Math.log(lam)-lam-lf(k)}
function lse(a){if(!a.length)return -700;const m=Math.max(...a);
 return m+Math.log(a.reduce((t,x)=>t+Math.exp(x-m),0))}

// ── 旧形式（v6まで：区間合計）の尤度。読み込んだ過去データ用にそのまま残す
function bathOld(T,l,s,sp,on){const v=T[l][s],o=on?3:0;
 const tot=v[o]+v[o+1]+v[o+2];if(tot<=0)return 0;let e=0;
 for(let i=0;i<3;i++)e+=(v[o+i]/tot)*(WEAKN*WEAK[i]+sp*STRONG[i]+BAR[i]);return e}
function logLikOld(iv,s){
  const w=LDIST[iv.role];if(!w)return 0;
  const nA=iv.a1+iv.a0,nB=iv.b1+iv.b0,N=nA+nB;if(N<=0)return 0;
  const nK=iv.a1+iv.b1,nN=iv.a0+iv.b0;
  const spK=nK>0?iv.strongK/nK:0,spN=nN>0?iv.strongN/nN:0;
  const wl=w[s];let tot=0;
  for(let l=0;l<4;l++){const pw=wl[l]/100;if(pw<=0)continue;
    const lamK=iv.a1*bathOld(A,l,s,spK,1)+iv.b1*bathOld(B,l,s,spK,1);
    const lamN=iv.a0*bathOld(A,l,s,spN,0)+iv.b0*bathOld(B,l,s,spN,0);
    const lg=lbin(iv.a1,nA,skw(A,l,s))+lbin(iv.b1,nB,skw(B,l,s))
            +poi(iv.bathK,lamK)+poi(iv.bathN,lamN);
    tot+=pw*Math.exp(lg);}
  return tot>0?Math.log(tot):-700;
}

// ── v7：セット単位
// 周期位置：開始位置 start(0〜5=1巡目の各周期, 6=2巡目以降) からの通し番号で決まる
const CYC=['アクア','めぐみん','ダクネス','ウィズ','ゆんゆん','クリス'];
const STARTS=['アクア','めぐみん','ダクネス','ウィズ','ゆんゆん','エリス','2巡目以降'];
function posOf(start,i){
 if(start===6)return{T:A,first:false,label:'2巡目以降'};
 const p=start+i;
 if(p<6)return{T:p===0?A:B,first:p>0,label:'1巡目 '+(p===5?'エリス':CYC[p])};
 return{T:A,first:false,label:(Math.floor(p/6)+1)+'巡目 '+CYC[p%6]};
}
const SKWV={on:1,off:0,unk:null};
// 1セットの対数尤度（モード選択レベル l・設定 s を固定）
function setLog(st,T,l,s){const v=T[l][s],sk=SKWV[st.skw],terms=[];
 for(let on=0;on<2;on++){if(sk!==null&&sk!==undefined&&sk!==on)continue;
  for(let z=0;z<3;z++){const p=v[on*3+z];if(p<=0)continue;
   let lg=Math.log(p);
   for(const k of st.strong)lg+=Math.log(Math.max(PCH[z][k],PFLOOR));
   const g=gOf(st);if(g!==null)lg+=poi(st.oth,LAM_OTH[z]*g/20);
   terms.push(lg)}}
 return lse(terms)}
function logLik7(iv,s){
 const w=LDIST[iv.role];if(!w||!iv.sets.length)return 0;
 const terms=[];
 for(let l=0;l<4;l++){if(iv.lv4&&l!==3)continue;
  const pw=w[s][l]/100;if(pw<=0)continue;
  let lg=Math.log(pw);
  iv.sets.forEach((st,i)=>{lg+=setLog(st,posOf(iv.start,i).T,l,s)});
  terms.push(lg)}
 return lse(terms)}
const logLik=(iv,s)=>iv.t===7?logLik7(iv,s):logLikOld(iv,s);


// ── 状態
// cur.set：進行中のセット（SKWを押した時点で開始）。null＝まだ開始していない
// 消化G数（1〜20）。旧v7の「途中終了」でG数不明のものは null＝その他お風呂を判定から除外
const gOf=S=>S.g===undefined?(S.part?null:20):S.g;
const SNEW=k=>({skw:k,strong:[],oth:0,g:20});
const BLANK=()=>({role:null,start:0,lv4:false,sets:[],set:null});
const VBLANK=()=>({v0:0,v1:0,v2:0,v3:0,v4:0,v5:0,v6:0,v7:0,v8:0,log:[]});
const QBLANK=()=>({q0s:0,q0f:0,q1s:0,q1f:0,q2s:0,q2f:0,log:[]});
let ivs=[],cur=BLANK(),voice=VBLANK(),quest=QBLANK(),ulog=[],flashKey=null,mode='main';
const ULOG_MAX=300;
const LABEL={st:'強キャラ役',skw:'セット開始',st0:'強→0個',st1:'強→1個',st2:'強→2個',st3:'強→3個+',oth:'その他お風呂',at:'AT当選',quit:'区間締め'};
VOICES.forEach(v=>LABEL[v.k]=v.n);
QUEST.forEach(q=>{LABEL[q.k+'s']=q.n+'・成功';LABEL[q.k+'f']=q.n+'・失敗'});

// 進行中のセットも含めた、この区間の全セット
const allSets=()=>cur.set?[...cur.sets,cur.set]:cur.sets;
function post(){const lg=[0,1,2,3,4,5].map(s=>ivs.reduce((a,iv)=>a+logLik(iv,s),0)
  +voiceLog(voice,s)+questLog(quest,s));
 const m=Math.max(...lg),e=lg.map(x=>Math.exp(x-m)),t=e.reduce((a,b)=>a+b,0);return e.map(x=>x/t)}
const voiceTot=()=>VOICES.reduce((a,v)=>a+(voice[v.k]||0),0);
const questTot=()=>QUEST.reduce((a,q)=>a+(quest[q.k+'s']||0)+(quest[q.k+'f']||0),0);
const setsOfOld=o=>o.a1+o.a0+o.b1+o.b0;
const setsOf=iv=>iv.t===7?iv.sets.length:setsOfOld(iv);
const roleName=k=>{const r=ROLES.find(x=>x.k===k);return r?r.n:'役未選択'};
const SKWN={on:'SKWあり',off:'SKWなし',unk:'SKW不明'};
const stTxt=S=>S.strong.length?'強'+S.strong.map(k=>k===3?'3+':k).join('·'):'強なし';
function setText(S){const g=gOf(S);
 return `${SKWN[S.skw]||'SKW?'}・${stTxt(S)}・他${S.oth}`+(g===20?'':`・${g===null?'途中終了':g+'G'}`)}
function ivText(iv){
 if(iv.t!==7)return `${setsOfOld(iv)}set・SKW${iv.a1+iv.b1}・風呂${iv.bathK}/${iv.bathN}・強${iv.strongK}/${iv.strongN}`;
 const nK=iv.sets.filter(s=>s.skw==='on').length,ns=iv.sets.reduce((a,s)=>a+s.strong.length,0),
  nb=iv.sets.reduce((a,s)=>a+s.strong.reduce((x,k)=>x+k,0),0),no=iv.sets.reduce((a,s)=>a+s.oth,0);
 return `${STARTS[iv.start]}〜・${iv.sets.length}set・SKW${nK}・強${ns}(風呂${nb})・他${no}`+(iv.lv4?'・Lv4':'')+(iv.quit?'・ヤメ':'')}

function miniUndo(el,last){
 if(!last){el.hidden=true;return}
 el.hidden=false;el.textContent='↩ '+(LABEL[last]||last)+' を取消';
}

// ── 下部ドック（タップ頻度の高い操作）
function dockHTML(){
 if(mode==='pad')return `<p class="dl">当選した時点の消化G数（そのセット）</p>
  <div class="pad">${Array.from({length:19},(_,i)=>`<button class="pk seg" data-g="${i+1}">${i+1}</button>`).join('')}
  <button class="pk cancel" id="padx">戻る</button></div>`;
 if(!cur.role&&!cur.set&&!cur.sets.length)return `<p class="dl">有利区間 1G目の成立役</p>
  <div class="droles">${ROLES.map(r=>`<button class="dr" data-r="${r.k}">${r.n}<small>${r.s}</small></button>`).join('')}</div>`;
 const S=cur.set,dis=S?'':' disabled',cnt=[0,0,0,0];if(S)S.strong.forEach(k=>cnt[k]++);
 return `<div class="drow r1">
   <button class="dk oth"${dis} data-oth="1"><span>その他お風呂</span><b class="seg" data-key="oth">${S?S.oth:0}</b></button>
   <button class="dk at"${dis} id="at">AT当選<small>20G</small></button>
   <button class="dk mid"${dis} id="mid">途中で<br>当選</button></div>
  <p class="dl">強キャラ役 → お風呂の連続数</p>
  <div class="drow r2">${['0個','1個','2個','3個+'].map((n,k)=>
   `<button class="dk st${k?' on':''}"${dis} data-sk="${k}"><b class="seg" data-key="st${k}">${cnt[k]}</b><span>${n}</span></button>`).join('')}</div>
  <p class="dl">${S?'次のセット開始（周期の頭でSKWを選択）':'1セット目を開始（SKWを選択）'}</p>
  <div class="drow r3">
   <button class="dk skw off" data-skw="off">SKWなし</button>
   <button class="dk skw on" data-skw="on">SKWあり</button>
   <button class="dk skw unk" data-skw="unk">不明</button></div>`;
}

function render(){
  const S=cur.set,n=allSets().length;
  // ドック
  const pos=posOf(cur.start,Math.max(n-1,0));
  document.getElementById('dnow').innerHTML=S
   ?`<b>${n}セット目</b>・${pos.label}<br><span>${setText(S)}</span>`
   :(cur.role?`<b>${roleName(cur.role)}</b>・${STARTS[cur.start]}から<br><span>SKWを押して1セット目を開始</span>`
     :'<b>新しい有利区間</b><br><span>1G目の成立役を選択</span>');
  document.getElementById('dbody').innerHTML=dockHTML();
  const ue=ulog[ulog.length-1];
  miniUndo(document.getElementById('undo'),ue&&(ue.a==='st'&&ue.k!==undefined?'st'+ue.k:ue.a));

  // 区間
  document.getElementById('roles').innerHTML=ROLES.map(r=>
   `<button class="chip" data-r="${r.k}" aria-pressed="${cur.role===r.k}">${r.n}<small>${r.s}</small></button>`).join('');
  document.getElementById('rolewarn').textContent=cur.role?'':'※未選択';
  document.getElementById('starts').innerHTML=STARTS.map((nm,i)=>
   `<button class="chip sm" data-st="${i}" aria-pressed="${cur.start===i}">${nm}</button>`).join('');
  const lv=document.getElementById('lv4');
  lv.setAttribute('aria-pressed',cur.lv4);lv.textContent=cur.lv4?'Lv4濃厚演出あり':'Lv4濃厚演出なし';
  document.getElementById('ivsum').textContent=n?`${n}set`:'';
  document.getElementById('setlist').innerHTML=n
   ?allSets().map((s,i)=>({s,i})).reverse().map(({s,i})=>`<div class="h${s===S?' live':''}"><span class="seg">${String(i+1).padStart(2,'0')}</span>
     <span>${posOf(cur.start,i).label} ／ ${setText(s)}</span>${s===S?'<span class="tg">進行中</span>':''}</div>`).join('')
   :'<div class="empty">まだセットはありません。</div>';
  document.getElementById('quit').disabled=!n;

  // クエスト・ボイス
  document.getElementById('quests').innerHTML=QUEST.map(q=>
   `<div class="qrow"><div class="qn"><span class="dot" style="background:${q.c}"></span><span>${q.n}<i>${q.s}</i></span></div>
    <button class="tap on" data-q="${q.k}s"><b data-key="${q.k}s" class="seg">${quest[q.k+'s']}</b><span>成功</span></button>
    <button class="tap off" data-q="${q.k}f"><b data-key="${q.k}f" class="seg">${quest[q.k+'f']}</b><span>失敗</span></button></div>`).join('');
  miniUndo(document.getElementById('qundo'),quest.log[quest.log.length-1]);
  document.getElementById('voices').innerHTML=VOICES.map(v=>
   `<div class="row"><button class="btn m" data-v="${v.k}" data-vd="-1">−</button>
    <div class="rn"><b>${v.n}</b><i>${v.s}</i></div>
    <div class="val seg" data-key="${v.k}">${voice[v.k]||0}</div>
    <button class="btn" data-v="${v.k}" data-vd="1">＋</button></div>`).join('');
  miniUndo(document.getElementById('vundo'),voice.log[voice.log.length-1]);

  // 推測（確定済みの区間のみ）
  const p=post(),ts=ivs.reduce((a,i)=>a+setsOf(i),0),vt=voiceTot(),qt=questTot();
  document.getElementById('tot').textContent=(ivs.length||vt||qt)
   ?`${ivs.length}区間 / ${ts}set / ${ts*20}G`+(qt?` / ク${qt}`:'')+(vt?` / 声${vt}`:''):'';
  document.getElementById('post').innerHTML=p.map((v,i)=>
   `<div class="bar"><div class="bk seg">${i+1}</div><div class="bt"><div class="bf" style="width:${(v*100).toFixed(1)}%"></div></div>
    <div class="bv seg">${(v*100).toFixed(1)}%</div></div>`).join('');
  document.getElementById('bands').innerHTML=[['低 1・2',p[0]+p[1]],['中 3・4',p[2]+p[3]],['高 5・6',p[4]+p[5]]]
   .map(([nm,v])=>`<div class="bc"><b class="seg">${(v*100).toFixed(0)}%</b><span>${nm}</span></div>`).join('');
  document.getElementById('sum').textContent=(ivs.length===0&&vt===0&&qt===0)
   ? '有利区間を締めるか、クエスト・ボイスを記録すると推測が出ます。事前分布は設定1〜6の均等。進行中の区間は推測に含みません。'
   : 'SKW・お風呂・クエストは高低群、ボイスは奇偶と下限の切り上げに効きます。強キャラ役の連続数は切れ目の紛れ込み（0〜5G均等）込みで計算。進行中の区間は含みません。';
  document.getElementById('hist').innerHTML=ivs.length===0
   ? '<div class="empty">まだ確定した有利区間はありません。</div>'
   : ivs.map((iv,i)=>({iv,i})).reverse().map(({iv,i})=>`<div class="h${iv.role?'':' bad'}"><span class="seg">${String(i+1).padStart(2,'0')}</span>
     <span>${roleName(iv.role)} ／ ${ivText(iv)}</span>${iv.t===7?'':'<span class="tg">旧</span>'}
     <button class="x" data-del="${i}" aria-label="削除">×</button></div>`).join('');

  if(flashKey){const el=document.querySelector(`[data-key="${flashKey}"]`);
   if(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
   flashKey=null;}
  // ドックの高さぶん本文の下に余白を取る
  document.body.style.paddingBottom=(document.getElementById('dock').offsetHeight+16)+'px';
}

// ── 保存・読込
function migOld(o){
 const nK=(o.a1||0)+(o.b1||0),nN=(o.a0||0)+(o.b0||0),t=nK+nN;
 ['a1','a0','b1','b0'].forEach(k=>{if(o[k]===undefined)o[k]=0});
 if(o.bath!==undefined&&o.bathK===undefined){
   o.bathK=t>0?Math.round((o.bath||0)*nK/t):0;o.bathN=(o.bath||0)-o.bathK;delete o.bath;}
 if(o.strong!==undefined&&o.strongK===undefined){
   o.strongK=t>0?Math.round((o.strong||0)*nK/t):0;o.strongN=(o.strong||0)-o.strongK;delete o.strong;}
 ['bathK','bathN','strongK','strongN'].forEach(k=>{if(o[k]===undefined)o[k]=0});
 if(o.role===undefined)o.role=null;delete o.log;delete o.t;
 return o;}
// 旧v7の入力中区間（確定ボタン方式）を新方式へ：入力途中のセットはSKWが選ばれていれば進行中セットに
function migCur(c){
 const n={...BLANK(),role:c.role??null,start:c.start??0,lv4:!!c.lv4,sets:Array.isArray(c.sets)?c.sets:[]};
 if(c.set===null||c.set===undefined)n.set=null;
 else if(c.set.skw)n.set={skw:c.set.skw,strong:c.set.strong||[],oth:c.set.oth||0,g:gOf(c.set)};
 else if(n.sets.length){n.set=n.sets.pop()} // SKW未選択の書きかけは捨て、直前のセットを進行中に戻す
 return n}
function save(){try{localStorage.setItem('konosuba:v7',JSON.stringify({ivs,cur,voice,quest,ulog}))}catch(e){}}
let loaded=false;
function load(){if(loaded)return;loaded=true;
 try{const raw7=localStorage.getItem('konosuba:v7');
  if(raw7){const d=JSON.parse(raw7);
    ivs=(d.ivs||[]).map(iv=>iv.t===7?iv:migOld(iv));
    if(d.cur)cur=migCur(d.cur);
    ulog=Array.isArray(d.ulog)?d.ulog:[];
    if(d.voice){voice={...VBLANK(),...d.voice};if(!voice.log)voice.log=[]}
    if(d.quest){quest={...QBLANK(),...d.quest};if(!quest.log)quest.log=[]}}
  else{const raw=localStorage.getItem('konosuba:v5')||localStorage.getItem('konosuba:v4')
     ||localStorage.getItem('konosuba:v3')||localStorage.getItem('konosuba:v2');
   if(raw){const d=JSON.parse(raw);ivs=(d.ivs||[]).map(migOld);
     if(d.cur){const c=migOld({...d.cur});if(setsOfOld(c)>0)ivs.push(c)}
     if(d.voice){voice={...VBLANK(),...d.voice};voice.log=[]}
     save()}}}catch(e){console.error('読込失敗',e)}
 draw()}

function draw(){try{render()}catch(e){console.error('render失敗',e)}}
const buzz=n=>{try{if(navigator.vibrate)navigator.vibrate(n)}catch(e){}};
const push=e=>{ulog.push(e);if(ulog.length>ULOG_MAX)ulog.splice(0,ulog.length-ULOG_MAX)};

// 区間を締める（g：最後のセットの消化G数）
function closeIv(g,quit){
 const prevG=cur.set?cur.set.g:undefined;
 if(cur.set){cur.set.g=g;cur.sets.push(cur.set)}
 const iv={t:7,role:cur.role,start:cur.start,lv4:cur.lv4,sets:cur.sets};if(quit)iv.quit=true;
 ivs.push(iv);push({a:quit?'quit':'at',hadSet:prevG!==undefined,prevG});cur=BLANK()}

// 取消：記録操作を1つずつ戻す（区間締めも戻せる）
function undo(){
 const e=ulog.pop();if(!e)return;
 if(e.a==='skw'){cur.set=e.had?cur.sets.pop():null}
 else if(e.a==='st'){if(cur.set){const k=cur.set.strong.pop();flashKey='st'+k}}
 else if(e.a==='oth'){if(cur.set&&cur.set.oth>0){cur.set.oth--;flashKey='oth'}}
 else if(e.a==='at'||e.a==='quit'){
   const iv=ivs.pop();if(!iv)return;
   cur={role:iv.role,start:iv.start,lv4:iv.lv4,sets:iv.sets,set:null};
   if(e.hadSet){cur.set=cur.sets.pop();cur.set.g=e.prevG}}
}
// SKWの連打対策：直前のセット開始から1.5秒以内の再タップは無視（セットは20Gなので連続はあり得ない）
let lastSkw=0;const SKW_GUARD=1500;

function handle(t){
  const ds=t.dataset||{};
  if(ds.r){cur.role=ds.r;buzz(12)}
  else if(ds.st!==undefined){cur.start=Number(ds.st);buzz(12)}
  else if(t.id==='lv4'){cur.lv4=!cur.lv4;buzz(12)}
  else if(ds.skw){
    if(!cur.role){buzz(28);return}
    const now=Date.now();if(now-lastSkw<SKW_GUARD){buzz(40);return}lastSkw=now;
    const had=!!cur.set;if(had)cur.sets.push(cur.set);
    cur.set=SNEW(ds.skw);push({a:'skw',had});buzz(18)}
  else if(ds.sk!==undefined){if(!cur.set)return;const k=Number(ds.sk);
    cur.set.strong.push(k);push({a:'st',k});flashKey='st'+k;buzz(12)}
  else if(ds.oth){if(!cur.set)return;cur.set.oth++;push({a:'oth'});flashKey='oth';buzz(12)}
  else if(t.id==='at'){if(!cur.set)return;closeIv(20);mode='main';buzz(30)}
  else if(t.id==='mid'){if(!cur.set)return;mode='pad';buzz(12)}
  else if(t.id==='padx'){mode='main';buzz(12)}
  else if(ds.g){if(!cur.set)return;closeIv(Number(ds.g));mode='main';buzz(30)}
  else if(t.id==='quit'){
    if(!allSets().length)return;
    if(!confirm('AT当選なしでこの区間を締めます。\n最後のセットは消化G数不明として扱います（その他お風呂は判定から除外）。'))return;
    closeIv(null,true);mode='main'}
  else if(t.id==='undo'){undo();mode='main';lastSkw=0;buzz(28)}
  else if(ds.q){const k=ds.q;quest[k]++;quest.log.push(k);flashKey=k;buzz(12)}
  else if(t.id==='qundo'){const k=quest.log.pop();if(k&&quest[k]>0){quest[k]--;flashKey=k}buzz(28)}
  else if(ds.v){const v=ds.v,d=Number(ds.vd);
    if(d>0){voice[v]=(voice[v]||0)+1;voice.log.push(v);flashKey=v;buzz(12)}
    else if(voice[v]>0){voice[v]--;const i=voice.log.lastIndexOf(v);if(i>=0)voice.log.splice(i,1);flashKey=v;buzz(28)}
    else{buzz(28);return}}
  else if(t.id==='vundo'){const k=voice.log.pop();if(k&&voice[k]>0){voice[k]--;flashKey=k}buzz(28)}
  else if(ds.del!==undefined){
    const i=Number(ds.del),iv=ivs[i];if(!iv)return;
    if(!confirm(`${String(i+1).padStart(2,'0')}番の区間を削除します。\n${roleName(iv.role)} ／ ${ivText(iv)}\nよろしいですか？`))return;
    ivs.splice(i,1);ulog=ulog.filter(e=>e.a!=='at'&&e.a!=='quit')} // 区間の並びが変わるので締めの取消は無効化
  else if(t.id==='reset'){
    const ts=ivs.reduce((a,i)=>a+setsOf(i),0);
    if(!confirm(`${ivs.length}区間（${ts}set）・進行中の区間・クエスト${questTot()}件・ボイス${voiceTot()}件を全て消去します。\n元に戻せません。`))return;
    ivs=[];cur=BLANK();voice=VBLANK();quest=QBLANK();ulog=[];mode='main'}
  else return;
  save();draw();
}

// スワイプ誤爆対策：指を置いた位置から一定以上動いたらタップとみなさない
let px=0,py=0,ptgt=null;const MOVE=10;
const unpress=()=>{if(ptgt){ptgt.classList.remove('pressed');ptgt=null}};
document.addEventListener('pointerdown',e=>{
  const t=e.target.closest('button');
  if(!t||t.disabled){unpress();return}
  px=e.clientX;py=e.clientY;ptgt=t;t.classList.add('pressed');
});
document.addEventListener('pointermove',e=>{
  if(ptgt&&(Math.abs(e.clientX-px)>=MOVE||Math.abs(e.clientY-py)>=MOVE))unpress();
});
document.addEventListener('pointercancel',unpress);
document.addEventListener('pointerup',e=>{
  if(!ptgt)return;
  const t=e.target.closest('button'),ok=t===ptgt
    &&Math.abs(e.clientX-px)<MOVE&&Math.abs(e.clientY-py)<MOVE;
  ptgt.classList.remove('pressed');ptgt=null;
  if(ok)handle(t);
});
window.addEventListener('resize',()=>{document.body.style.paddingBottom=(document.getElementById('dock').offsetHeight+16)+'px'});
load();
</script>
